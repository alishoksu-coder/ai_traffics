# Лимиты памяти — уменьшены для машин с ограниченной RAM
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Стабильность сборки
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
# Kotlin daemon — ограничение памяти
kotlin.daemon.jvmargs=-Xmx1G -XX:+UseSerialGC
